name: Build release

# A tag like v1.0.0 builds everything and attaches it to a DRAFT release (publish it by hand after the Microsoft and
# VirusTotal checks in RELEASE.md). "Run workflow" builds the same files as a downloadable artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write       # create the draft release
  id-token: write       # sign the build attestation
  attestations: write

env:
  FFMPEG_TAG: n8.1.3    # FFmpeg release to compile
  NUITKA_VERSION: 4.2.2

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "numeric=$(echo "$V" | cut -d- -f1).0" >> "$GITHUB_OUTPUT"

      # ---- FFmpeg, compiled from its official source with only what the tool needs (LGPL 2.1+) ----
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            make
            diffutils
            pkgconf
            git
      - name: Build FFmpeg
        shell: msys2 {0}
        run: bash tools/build_ffmpeg.sh ffmpeg-out

      # ---- the program, compiled to a native exe with Nuitka ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Nuitka
        run: python -m pip install "nuitka==${{ env.NUITKA_VERSION }}"
      - name: Compile SkyrimVoiceRefs.exe
        run: >-
          python -m nuitka src/build_voice_refs.py
          --standalone --assume-yes-for-downloads --msvc=latest
          --output-dir=build --output-filename=SkyrimVoiceRefs.exe
          --windows-console-mode=force
          --company-name=Cecell
          --product-name="Skyrim Voice References"
          --file-description="Builds Chatterbox voice-cloning references from your own Skyrim SE"
          --copyright="Copyright (c) 2026 Cecell. MIT License."
          --file-version=${{ steps.v.outputs.numeric }}
          --product-version=${{ steps.v.outputs.numeric }}

      # ---- assemble, test, attest ----
      - name: Assemble the portable folder
        run: python tools/assemble.py --version ${{ steps.v.outputs.version }} --exe-dir build/build_voice_refs.dist --ffmpeg-dir ffmpeg-out --out dist
      - name: Smoke test
        shell: bash
        run: |
          cd "dist/SkyrimVoiceRefs"
          ./SkyrimVoiceRefs.exe --help
          ./ffmpeg/ffmpeg.exe -hide_banner -demuxers | grep -q xwma
          ./ffmpeg/ffmpeg.exe -hide_banner -decoders | grep -q wmav2
          python source/build_voice_refs.py --help > /dev/null
      - name: VirusTotal scan
        # needs the repository secret VT_API_KEY (a free VirusTotal account's API key); skipped without it.
        # Results go to this run's summary page and into the draft release notes. A VirusTotal outage doesn't
        # stop the build: the notes then keep their "(link)" placeholder.
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        shell: bash
        run: |
          python tools/virustotal.py dist/release-notes.md dist/SkyrimVoiceRefs-*.zip \
            dist/SkyrimVoiceRefs/SkyrimVoiceRefs.exe dist/SkyrimVoiceRefs/ffmpeg/ffmpeg.exe
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/SkyrimVoiceRefs-*.zip
            dist/SkyrimVoiceRefs/SkyrimVoiceRefs.exe
            dist/SkyrimVoiceRefs/ffmpeg/ffmpeg.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SkyrimVoiceRefs-${{ steps.v.outputs.version }}
          path: |
            dist/SkyrimVoiceRefs-*.zip
            dist/SHA256SUMS.txt

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "Skyrim Voice References $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md dist/SkyrimVoiceRefs-*.zip dist/SHA256SUMS.txt
